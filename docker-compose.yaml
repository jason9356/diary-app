# Prefer running from server/:
#   cd server && docker compose up -d --build
#
# Or from repo root:

services:
  sync-api:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DIARY_SYNC_TOKEN: ${DIARY_SYNC_TOKEN:?set DIARY_SYNC_TOKEN}
      DIARY_SYNC_DATA: /data
    volumes:
      - ./server/data:/data
    restart: unless-stopped
